name: QLCplus Github Actions CI Build

on: ["push", "pull_request", "workflow_dispatch"]   # workflow_dispatch: a build by hand (runde 407)

jobs:
  startup-guards:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S startup_guard -B guard-build
      - run: cmake --build guard-build --config Release
      - run: python startup_guard/test_guards.py --probe-dir guard-build

  # TRACK_APP_SMOKE (track-app branch, Tobias 11-04): TRACK's beat-link helper on Beat Link
  # Trigger's released jar - it loads our shared functions, says hello on 9998, respects
  # the PC's beat-link lock and stops when QLC+ closes its pipe (no CDJs here)
  trackbridge-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Beat Link Trigger 8.0.0 jar (cached)
        id: bltjar
        uses: actions/cache@v4
        with:
          path: blt-jar
          key: blt-jar-8.0.0
      - name: Download it
        if: steps.bltjar.outputs.cache-hit != 'true'
        run: |
          mkdir -p blt-jar
          curl -fsSL -o blt-jar/beat-link-trigger.jar https://github.com/Deep-Symmetry/beat-link-trigger/releases/download/v8.0.0/beat-link-trigger-8.0.0.jar
      - run: python3 trackbridge/make_jar.py trackbridge.jar
      - run: python3 trackbridge/smoke_test.py blt-jar/beat-link-trigger.jar trackbridge.jar
      - name: get-track-app.cmd parses as PowerShell
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText("tools/get-track-app.cmd"), [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.ToString() }; exit 1 }
          Write-Host "tools/get-track-app.cmd: no parse errors"

  build-linux:
    #if: false
    runs-on: ubuntu-22.04
    name: QLCplus Linux ${{matrix.task}}
    strategy:
      #fail-fast: false
      matrix:
        task: [build-v4, build-v5, coverage-build-v4]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      CC: gcc
      CXX: g++
      PACKAGES_BASE:
        gdb
        libasound2-dev
        libusb-1.0-0-dev
        libftdi1-dev
        shared-mime-info
        libudev-dev
        libmad0-dev
        libsndfile1-dev
        liblo-dev
        libfftw3-dev
        libgl1-mesa-dev
        libxml2-utils
        xvfb
        chrpath
        libfuse2
        wget
      PACKAGES_V5_BASE:
        libpulse-dev
      PACKAGES_COVERAGE_BASE:
        lcov

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set General ENV variables
        run: |
          echo "PACKAGES_V4=$(echo ${PACKAGES_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_V5=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_COVERAGE=$(echo ${PACKAGES_BASE} ${PACKAGES_V4_BASE} ${PACKAGES_COVERAGE_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_ALL=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE} ${PACKAGES_COVERAGE_BASE})" >> $GITHUB_ENV
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "INSTALL_ROOT=`pwd`/install_root" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set Qt ENV variables (v4)
        if: ${{ endsWith( matrix.task, 'v4') }}
        run: |
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QT_INSTALL_DIR=/opt" >> $GITHUB_ENV
          echo "QT_VERSION=6.9.3" >> $GITHUB_ENV
          source $GITHUB_ENV && echo "QTDIR=${QT_INSTALL_DIR}/Qt/${QT_VERSION}/gcc_64" >> $GITHUB_ENV

      - name: Set Qt ENV variables (v5)
        if: ${{ endsWith( matrix.task, 'v5') }}
        run: |
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QT_INSTALL_DIR=/opt" >> $GITHUB_ENV
          echo "QT_VERSION=6.10.2" >> $GITHUB_ENV
          source $GITHUB_ENV && echo "QTDIR=${QT_INSTALL_DIR}/Qt/${QT_VERSION}/gcc_64" >> $GITHUB_ENV

      - name: Print ENV vars
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "PACKAGES_V4: ${PACKAGES_V4}"
          echo "PACKAGES_V5: ${PACKAGES_V5}"
          echo "PACKAGES_COVERAGE: ${PACKAGES_COVERAGE}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Download, cache and install packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: ${{env.PACKAGES_ALL}}
          version: ${{runner.os}}-apt

      - name: Install Qt through aqt (and python)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Install python-lxml for fixtures-tool # with the now-registered aqt python
        run: pip install lxml

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Setup ruby cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Install coveralls-lcov
        if: ${{ startsWith( matrix.task, 'coverage') }}
        run: sudo gem install coveralls-lcov

      - name: Print program versions and username
        run: |
          echo "CXX:"
          ${CXX} --version
          echo "Python:"
          python --version
          echo "WHOAMI:"
          whoami

      - name: Configure for v4 build
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR/lib/cmake/" -Dappimage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure for v5 build
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR/lib/cmake/" -Dqmlui=ON -Dappimage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure for coverage build
        if: ${{ matrix.task == 'coverage-build-v4' }}
        run: |
          cmake -DCMAKE_PREFIX_PATH="/opt/Qt/$QT_VERSION/gcc_64/lib/cmake" -Dcoverage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -B build

      - name: Build
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cmake --build build --parallel `nproc`

      - name: Test
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: cmake --build build --target check

      - name: Test with Coverage
        if: ${{ startsWith( matrix.task, 'coverage') }}
        run: cmake --build build --target lcov

      - name: Coveralls
        if: ${{ startsWith( matrix.task, 'coverage') }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.info
          format: lcov

      - name: Install
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          cmake --build build --target install
          cp -v resources/icons/svg/qlcplus.svg ${INSTALL_ROOT}
          # R516_CI_APPIMAGE_ICON: appimagetool continuous (10-29) wants a png/xpm icon and .DirIcon at the root
          cp -v resources/icons/png/qlcplus.png ${INSTALL_ROOT}
          ln -sfv qlcplus.png ${INSTALL_ROOT}/.DirIcon
          cp -v platforms/linux/qlcplus.desktop ${INSTALL_ROOT}

      - name: Set APPVERSION
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Adapt qlcplus for AppImage (v4)
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          chrpath -r "../lib" ${INSTALL_ROOT}/usr/bin/qlcplus

      - name: Adapt qlcplus for AppImage (v5)
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          chrpath -r "../lib" ${INSTALL_ROOT}/usr/bin/qlcplus-qml
          sed -i -e 's/Exec=qlcplus --open %f/Exec=qlcplus-qml/g' ${INSTALL_ROOT}/qlcplus.desktop

      - name: Store original install artifacts before stripping and AppImage
        # Activate for debugging
        if: ${{ false && ! startsWith( matrix.task, 'coverage') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-files
          path: ${{ env.INSTALL_ROOT }}

      - name: Strip Binaries (v4)
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          strip -v ${INSTALL_ROOT}/usr/bin/qlcplus
          find ${INSTALL_ROOT}/usr/lib/ -name libqlcplusengine.so.1.0.0 -exec strip -v {} \;

      - name: Strip Binaries (v5)
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          strip -v ${INSTALL_ROOT}/usr/bin/qlcplus-qml
          find ${INSTALL_ROOT}/usr/lib/ -name libqlcplusengine.so.1.0.0 -exec strip -v {} \;

      - name: Delete unused files for AppImage
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          find ${INSTALL_ROOT}/usr/bin/ -name plugins.qmltypes -type f -delete
          find ${INSTALL_ROOT}/usr/bin -name *.qmlc -type f -delete
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Extras QtQuick/Particles.2 QtQuick/XmlListModel
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/designer QtQuick/Controls.2/Material
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Universal QtQuick/Controls.2/Fusion
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Imagine QtQuick/Controls.2/Scene2D

      - name: Build AppImage
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64 -O ${INSTALL_ROOT}/AppRun
          chmod a+x ${INSTALL_ROOT}/AppRun
          wget -c https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O ./appimagetool-x86_64.AppImage
          chmod a+x ./appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage -v ${INSTALL_ROOT}
          mv -v Q_Light_Controller_Plus_-_QLC+-x86_64.AppImage qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage

      - name: Test Load AppImage
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          ./qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage --platform offscreen --version

      - name: Store AppImage artifacts
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-AppImage
          path: qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage

  build-windows:
    runs-on: windows-latest
    name: QLCplus Windows ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v4, build-v5]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Set ENV variables
        shell: bash
        run: |
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QTDIR=/d/a/qlcplus/qlcplus/qt/Qt/${{ env.QT_VERSION }}/mingw_64" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set v4 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          echo "OUTFILE=`grep 'OutFile' platforms/windows/qlcplus4Qt6.nsi | cut -d'"' -f 2`" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus4Qt6.nsi" >> $GITHUB_ENV

      - name: Set v5 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          echo "OUTFILE=`grep 'OutFile' platforms/windows/qlcplus5Qt6.nsi | cut -d'"' -f 2`" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus5Qt6.nsi" >> $GITHUB_ENV

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: "${{ github.workspace }}/qt/"
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Update and install MSYS2 (64bit)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-nsis

      # The SDK zip is fetched ONCE and kept in the Actions cache. qlcplus.org
      # sits behind Cloudflare, which answers GitHub's runners with 429 Too Many
      # Requests - five tries 30 s apart all got 429 on 2026-09-24 and the
      # Windows build was lost. With the zip cached, a build does not ask at
      # all; only a cache miss (a new version below, or 7 days unused) does.
      # restore + save as two steps: the combined action only saves when the
      # whole job succeeds, and a build that fails later would throw the
      # download away and ask qlcplus.org again next time.
      - name: D2XX SDK cache
        id: d2xx-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/projects/D2XXSDK/cdm.zip
          key: d2xx-CDM-v2.12.36.20-WHQL-Certified

      # 2026-09-25: every Windows build since #300 died here - qlcplus.org's
      # Cloudflare answers GitHub's runners 429 on every try, so the cache
      # below was never filled either. Now, in order:
      #   1. the zip committed in the repo (.github/ci/, if someone put it
      #      there - FTDI's licence allows passing it on unchanged),
      #   2. the Actions cache,
      #   3. qlcplus.org, three tries,
      #   4. and failing all of that the build goes on WITHOUT the FTDI D2XX
      #      driver: the DMX USB plugin is built without FTDI support
      #      (plugins/dmxusb/src/CMakeLists.txt checks for the library).
      #      Art-Net, sACN and the rest are untouched.
      - name: D2XX SDK (64 bit)
        id: d2xx
        shell: msys2 {0}
        env:
          D2XX_CACHED: ${{ steps.d2xx-cache.outputs.cache-hit }}
        run: |
          mkdir -p /c/projects/D2XXSDK
          ZIP=/c/projects/D2XXSDK/cdm.zip
          # a glob, not "ls | head": the msys2 shell runs with -e and pipefail,
          # and ls finding nothing exits 2 - which ended the step (#307)
          REPOZIP=""
          for f in .github/ci/CDM-*.zip; do
            if [ -f "$f" ]; then REPOZIP="$f"; break; fi
          done
          if [ -n "$REPOZIP" ]; then
            cp "$REPOZIP" "$ZIP"
            echo "D2XX SDK from the repo: $REPOZIP"
          elif [ "$D2XX_CACHED" = "true" ] && [ -s "$ZIP" ]; then
            echo "D2XX SDK from the cache"
          else
            for wait in 30 60 0; do
              wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O "$ZIP" && break
              rm -f "$ZIP"
              if [ "$wait" = 0 ]; then break; fi
              echo "D2XX download failed - waiting $wait s"
              sleep $wait
            done
          fi
          if [ -s "$ZIP" ]; then
            cd /c/projects/D2XXSDK
            unzip -o cdm.zip
            cd amd64
            gendef.exe - ftd2xx64.dll > ftd2xx.def
            dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a
            echo "got=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::D2XX SDK not available - building the DMX USB plugin without FTDI D2XX support"
            echo "got=false" >> "$GITHUB_OUTPUT"
          fi

      - name: D2XX SDK cache (save)
        if: steps.d2xx-cache.outputs.cache-hit != 'true' && steps.d2xx.outputs.got == 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/projects/D2XXSDK/cdm.zip
          key: d2xx-CDM-v2.12.36.20-WHQL-Certified

      - name: Print program versions
        shell: msys2 {0}
        run: |
          echo "pwd:"
          pwd
          echo "CXX:"
          which ${CXX} || true
          ${CXX} -v || true
          echo "cmake:"
          which cmake || true
          cmake --version || true
          pkg-config --modversion libusb-1.0
          echo "ccache:"
          ccache --version || true

      - name: Fix build
        shell: msys2 {0}
        run: |
          # force a release build
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          # disable Velleman plugin
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          # fix MSYS2 system path
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt
          # fix project path in NSIS script
          sed -i -e 's/c\:\\projects/d:\\a\\qlcplus/g' platforms/windows/${{env.NSIS_SCRIPT}}

      - name: Configure v4 build for Windows
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure v5 build for Windows
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v5' }}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dqmlui=ON

      - name: Build for Windows
        shell: msys2 {0}
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          ninja

      - name: Install on Windows
        shell: msys2 {0}
        run: |
          cd build
          ninja install

      - name: Set APPVERSION
        shell: msys2 {0}
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Run windeployqt for v4
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          ./translate.sh release ui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${{ env.QTDIR }}/bin/windeployqt qlcplus.exe qlcplusengine.dll qlcplusui.dll qlcpluswebaccess.dll plugins/dmxusb.dll
          # Keep Qt's own libstdc++/libgcc (deployed by windeployqt) - they
          # match Qt6Multimedia.dll (emulated-TLS MinGW). Only override
          # libwinpthread, whose Qt copy is too old for the Ableton Link
          # library (needs pthread_cond_timedwait64).
          cp -f /mingw64/bin/libwinpthread-1.dll /c/qlcplus/

      - name: Run windeployqt for v5
        shell: msys2 {0}
        if: ${{ matrix.task == 'build-v5' }}
        run: |-
          SRC_DIR=$PWD
          ./translate.sh release qmlui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${{ env.QTDIR }}/bin/windeployqt --qmldir $SRC_DIR/qmlui/qml qlcplus-qml.exe qlcplusengine.dll plugins/dmxusb.dll
          # Keep Qt's own libstdc++/libgcc (deployed by windeployqt) - they
          # match Qt6Multimedia.dll (emulated-TLS MinGW). Only override
          # libwinpthread, whose Qt copy is too old for the Ableton Link
          # library (needs pthread_cond_timedwait64).
          cp -f /mingw64/bin/libwinpthread-1.dll /c/qlcplus/

      # TRACK_APP_LOADGUARD_R600 (the lys-pc's log of 11-14): every build from R588 to R599 was green here and
      # still stopped at its first start on the lys-pc (0xC0000139 - a function missing from a shipped DLL), so
      # the launcher went back to R572 each time. Nothing here ever started the build. Two checks now, before
      # anything is packed: every import against the DLLs in the folder, and one real start with a clean PATH
      - name: Every import is in the shipped DLLs
        if: ${{ matrix.task == 'build-v5' }}
        shell: pwsh
        run: python trackbridge/check_imports.py C:\qlcplus

      - name: Windows can start the build
        if: ${{ !cancelled() && matrix.task == 'build-v5' }}
        shell: pwsh
        run: |
          $exe = 'C:\qlcplus\qlcplus-qml.exe'
          if (-not (Test-Path $exe)) { Write-Host 'no build to start'; exit 1 }
          # as TRACK's launcher: no dialog for a missing DLL or function - the exit code says it
          Add-Type -Namespace TrackGuard -Name Native -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint uMode);'
          [TrackGuard.Native]::SetErrorMode(0x8003) | Out-Null
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.Arguments = '--version'
          $psi.WorkingDirectory = 'C:\qlcplus'
          $psi.UseShellExecute = $false
          # a PC without MSYS2 or Qt: only Windows' own folders beside the build's
          $psi.EnvironmentVariables['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
          $psi.EnvironmentVariables['QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES'] = '1'
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            Write-Host 'still running after 30 s: Windows started it'
            exit 0
          }
          $hex = '{0:X8}' -f $p.ExitCode
          Write-Host "exit code 0x$hex"
          if ($hex -in @('C0000139', 'C0000135', 'C0000138', 'C000007B', 'C0000142')) {
            Write-Host 'Windows could not start the build: a DLL, or a function in one, is missing (see the step above)'
            exit 1
          }
          exit 0

      - name: Build installation package
        shell: msys2 {0}
        run: |
          cd /c/qlcplus
          echo 'Creating package...'
          makensis -X'SetCompressor /FINAL lzma' ${{env.NSIS_SCRIPT}}
          mv /c/qlcplus/${{env.OUTFILE}} /d/a/qlcplus/qlcplus/${{matrix.task}}-${{env.OUTFILE}}

      - name: Store executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{matrix.task}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.exe
          path: ${{matrix.task}}-${{env.OUTFILE}}

      # TRACK_APP_PORTABLE (track-app branch): the same v5 build as a plain folder for the TRACK
      # app - unzipped beside the rig's QLC+ by tools/get-track-app.cmd, never installed over it
      # (no installer, no registry, no shortcuts of QLC+'s own)
      # R548_LAUNCHER: TRACK.exe in %LOCALAPPDATA%\TRACK - starts the build current.txt names
      - name: TRACK launcher
        if: ${{ matrix.task == 'build-v5' }}
        shell: msys2 {0}
        run: |
          CC=$(command -v x86_64-w64-mingw32-gcc || command -v gcc)
          WR=$(command -v x86_64-w64-mingw32-windres || command -v windres)
          $WR trackbridge/launcher/track_launcher.rc -O coff -o track_launcher.res      # R549: TRACK's icon + version info
          $CC -O2 -s -Wall -Wextra -Werror -municode -mwindows -o /c/qlcplus/TRACK-launcher.exe trackbridge/launcher/track_launcher.c track_launcher.res
          ls -la /c/qlcplus/TRACK-launcher.exe

      - name: Portable folder for the TRACK app
        if: ${{ matrix.task == 'build-v5' }}
        shell: pwsh
        run: |
          7z a -tzip TRACK-app-base.zip C:\qlcplus\*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store the portable folder
        if: ${{ matrix.task == 'build-v5' }}
        uses: actions/upload-artifact@v7
        with:
          name: TRACK-app-base
          path: TRACK-app-base.zip

  # runde 439 (N9): the rig's build as the GitHub release "rig-latest" -
  # tools/update-qlc.ps1 on the lys-pc fetches it (public repo, no login).
  # track-layout only: the rig runs the v2 page.
  release-rig:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/track-layout' }}
    needs: [build-windows, startup-guards]
    runs-on: ubuntu-22.04
    name: Rig release (track-layout)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the Windows v5 installer
        uses: actions/download-artifact@v4
        with:
          pattern: QLC+-build-v5-*
          path: dl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build BLT startup guard
        run: python3 startup_guard/compile_blt_guard.py qlc-blt-guard.jar

      - name: Publish rig-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          EXE=$(find dl -type f -name '*.exe' | head -1)
          test -n "$EXE"
          REV=$(git rev-parse --short HEAD)
          cp "$EXE" QLC-rig-setup.exe
          echo "$REV" > rig-build.txt
          NOTES="track-layout $REV, built $(date -u '+%Y-%m-%d %H:%M') UTC - $(git log -1 --format=%s)"
          if gh release view rig-latest > /dev/null 2>&1; then
            gh release edit rig-latest --prerelease --notes "$NOTES"
          else
            gh release create rig-latest --target "$GITHUB_SHA" --prerelease --title "Rig build (track-layout)" --notes "$NOTES"
          fi
          gh release upload rig-latest QLC-rig-setup.exe rig-build.txt tools/update-qlc.cmd tools/rollback-qlc.cmd qlc-blt-guard.jar tools/install-blt-guard.ps1 --clobber

  # TRACK_APP_RELEASE (track-app branch, Tobias 11-04: "Lav en ny gren, og byg de to vi lige har
  # lagt i backloggen paa den, saa kan jeg teste i weekenden"): the TRACK app as its own
  # prerelease "track-app-latest" - TRACK.exe (QLC+'s engine, --track-app), trackbridge.jar (the
  # beat-link helper) - and tools/get-track-app.cmd. rig-latest and update-qlc.cmd are never
  # touched from this branch (release-rig runs only for track-layout).
  release-track-app:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/track-app' }}
    needs: [build-windows, trackbridge-smoke]
    runs-on: ubuntu-22.04
    name: TRACK app release (track-app)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the portable folder
        uses: actions/download-artifact@v4
        with:
          name: TRACK-app-base
          path: dl

      # R548_RUNTIME (Tobias 11-04: "den skal kunne deployes paa en ren pc og saa bare virke fra
      # start"): Java (Eclipse Temurin JRE 21, pinned) and beat-link (BLT 8.0.0's own jar, unmodified)
      # go with TRACK as TRACK-runtime-<id>.zip - the same bytes every build, so a PC fetches it once
      - name: JRE and BLT jar (cached)
        id: rtcache
        uses: actions/cache@v4
        with:
          path: rt-in
          key: track-runtime-jre-21.0.5_11-blt-8.0.0

      - name: Download them
        if: steps.rtcache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p rt-in
          curl -fsSL -o rt-in/jre.zip "https://api.adoptium.net/v3/binary/version/jdk-21.0.5%2B11/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
          curl -fsSL -o rt-in/beat-link-trigger.jar https://github.com/Deep-Symmetry/beat-link-trigger/releases/download/v8.0.0/beat-link-trigger-8.0.0.jar
          ls -la rt-in

      - name: Build the release files
        run: |
          set -e
          REV=$(git rev-parse --short HEAD)
          # TRACK_APP_BUILDNOTE_R601: the commit's subject - its R-number is shown on TRACK's page
          python3 trackbridge/make_release.py --base dl/TRACK-app-base.zip --rev "$REV" \
              --jre rt-in/jre.zip --blt rt-in/beat-link-trigger.jar --out rel \
              --label "$(git log -1 --format=%s)"
          ls -la rel

      - name: Publish track-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REV=$(git rev-parse --short HEAD)
          NOTES="track-app $REV, built $(date -u '+%Y-%m-%d %H:%M') UTC - $(git log -1 --format=%s)"
          if gh release view track-app-latest > /dev/null 2>&1; then
            gh release edit track-app-latest --prerelease --notes "$NOTES"
          else
            gh release create track-app-latest --target "$GITHUB_SHA" --prerelease --title "TRACK app test (track-app)" --notes "$NOTES"
          fi
          RT=$(ls rel/TRACK-runtime-*.zip)
          RTNAME=$(basename "$RT")
          # the runtime only when the release has not got these bytes yet (175 MB)
          HAVE=$(gh api "repos/${{ github.repository }}/releases/tags/track-app-latest" -q ".assets[] | select(.name == \"$RTNAME\") | .digest" || true)
          WANT="sha256:$(sha256sum "$RT" | cut -d' ' -f1)"
          if [ "$HAVE" = "$WANT" ]; then echo "runtime $RTNAME already there"; else gh release upload track-app-latest "$RT" --clobber; fi
          # the build before the manifest that names it
          gh release upload track-app-latest rel/TRACK-app.zip --clobber
          gh release upload track-app-latest rel/track-app.json rel/track-app-build.txt tools/get-track-app.cmd --clobber

  build-macos:
    runs-on: macos-15
    name: QLCplus macOS ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v4, build-v5]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"
      MACOS_KEYCHAIN: build.keychain
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set ENV variables
        shell: bash
        run: |
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "QTDIR=${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          echo "NPROC=`sysctl -n hw.ncpu`" >> $GITHUB_ENV

      - name: Set v4 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |

      - name: Set v5 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v5' }}
        run: |

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QTDIR: ${QTDIR}"
          echo "NPROC: ${NPROC}"

      - name: Dependencies
        run: |
          brew update
          brew install fftw mad libsndfile libftdi
          # the runner image no longer ships python@3.13, and "No such keg"
          # stopped every macOS build (#296 onwards) - the link is only there
          # to settle a conflict, so it may fail harmlessly. Asked first
          # (runde 230): brew still printed "Error: No such keg" and every
          # run showed it as an error annotation
          if brew list --versions python@3.13 >/dev/null 2>&1; then
            brew link --overwrite python@3.13 || true
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "${{ github.workspace }}/qt/"
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Import macOS signing certificate
        shell: bash
        if: false # ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |
          echo "${MACOS_CERT_P12}" | base64 --decode > /tmp/macos_cert.p12
          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security default-keychain -s "${MACOS_KEYCHAIN}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security import /tmp/macos_cert.p12 -k "${MACOS_KEYCHAIN}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          rm -f /tmp/macos_cert.p12

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Configure v4 build
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure v5 build
        shell: bash
        if: ${{ matrix.task == 'build-v5' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -Dqmlui=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: |-
          sed -i '' "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          make -j${{ env.NPROC }}

      - name: Install
        shell: bash
        run: |-
          cd build
          make install/fast

      - name: Set APPVERSION
        shell: bash
        run: |-
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Fix v4 dylib dependencies
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus-fixtureeditor
          ${{ env.QTDIR }}/bin/macdeployqt ~/QLC+.app

      - name: Fix v5 dylib dependencies
        shell: bash
        if: ${{ matrix.task == 'build-v5' }}
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus-qml
          ${{ env.QTDIR }}/bin/macdeployqt ~/QLC+.app -qmldir=qmlui/qml

      - name: Create DMG
        # Use retry loop to work around a race condition on macOS causing
        # 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 12
          retry_wait_seconds: 1
          command: |
            OUTDIR=$PWD
            cd platforms/macos/dmg
            ./create-dmg --volname "Q Light Controller Plus ${{env.APPVERSION}}" \
            --volicon $OUTDIR/resources/icons/qlcplus.icns \
            --background background.png \
            --window-size 400 300 \
            --window-pos 200 100 \
            --icon-size 64 \
            --icon "QLC+" 0 150 \
            --app-drop-link 200 150 \
            $OUTDIR/QLC+_${{ matrix.task }}.dmg \
            ~/QLC+.app

      - name: Notarize and staple DMG
        shell: bash
        if: false # ${{ env.MACOS_NOTARY_KEY_P8 != '' }}
        run: |-
          DMG_PATH="QLC+_${{ matrix.task }}.dmg"
          echo "${MACOS_NOTARY_KEY_P8}" > /tmp/AuthKey.p8
          xcrun notarytool submit \
            --key /tmp/AuthKey.p8 \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER}" \
            --wait "${DMG_PATH}"
          xcrun stapler staple "${DMG_PATH}"
          rm -f /tmp/AuthKey.p8

      - name: Store DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.dmg
          path: QLC+_${{ matrix.task }}.dmg
